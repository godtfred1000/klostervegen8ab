<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181818">
  <meta name="robots" content="noindex, nofollow">
  <title>SOLGT – Klostervegen 8A og 8B</title>
  <meta name="description" content="Klostervegen 8A og 8B er solgt. Nettsiden er satt på pause.">
  <style>
    :root { color-scheme: dark; --gold: #bd8840; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #181818; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    .topbar { background: #181818; padding: 20px 24px; text-align: center; font-size: 17px; font-weight: 800; }
    main {
      min-height: calc(100svh - 64px);
      display: flex; align-items: center; justify-content: center;
      padding: 48px 20px;
      background:
        linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.48)),
        url("bilder/hovedbilde.png") center center / cover no-repeat;
    }
    .message { width: min(100%, 850px); text-align: center; }
    .property { display: inline-block; padding: 10px 16px; border-radius: 8px; background: var(--gold); color: #fff; font-weight: 800; font-size: 14px; }
    h1 { margin: 20px 0 12px; font-size: clamp(76px, 17vw, 160px); font-weight: 900; line-height: 1; letter-spacing: -.045em; }
    .lead { font-size: clamp(20px, 3.5vw, 29px); font-weight: 700; margin: 16px auto; }
    .status { max-width: 660px; margin: 22px auto 0; padding: 18px 22px; background: rgba(22,22,22,.62); border: 1px solid rgba(255,255,255,.28); border-radius: 10px; font-size: clamp(16px, 2.2vw, 19px); line-height: 1.65; }
    .status p { margin: 0; }
    .status p + p { margin-top: 10px; color: rgba(255,255,255,.84); }
    @media (max-width: 540px) {
      .topbar { padding: 16px; font-size: 15px; }
      main { min-height: calc(100svh - 55px); }
      h1 { font-size: clamp(68px, 18vw, 100px); }
      .status { padding: 15px; }
    }
  </style>
</head>
<body>
  <header class="topbar">Klostervegen 8A og 8B</header>
  <main>
    <div class="message">
      <span class="property">Klostervegen 8A og 8B</span>
      <h1>SOLGT</h1>
      <p class="lead">Eiendommen er solgt.</p>
      <div class="status">
        <p>Salgssiden er nå satt på pause, og det tas ikke imot nye henvendelser eller visningsforespørsler her.</p>
        <p>Nettsiden og innholdet er bevart for eventuell videre bruk av ny eier.</p>
      </div>
    </div>
  </main>
</body>
</html>
